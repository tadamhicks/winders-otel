# Additions merged into the running collector config at
#   C:\Program Files (x86)\OpenTelemetry Collector\config.yaml
# (backups: config.yaml.bak-20261030 = original, config.yaml.bak-20261030-2 = before IIS/SQL,
#  config.yaml.bak-20261031 = before resource/namespace, config.yaml.bak-20261031-2 = before
#  dropping namespace entirely, config.yaml.bak-20261102 = before transform/sqlclient_spans,
#  config.yaml.bak-20261105 = before the second (demo) exporter).
# Not a standalone config — the otlphttp/groundcover exporter, memory_limiter/batch
# processors and the host pipelines (metrics/host, metrics/self, logs) already exist there.
# Kept here (without API keys) so changes are tracked.

receivers:
  # OTLP from local apps (books-dotnet in IIS via the .NET zero-code agent).
  # Loopback only — nothing off-box should send here.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # IIS performance counters (per site / app pool).
  iis:
    collection_interval: 30s

  # SQL Server: perf counters + direct connection (Windows auth as LocalSystem,
  # loopback TCP only — see deploy/configure-sql-monitoring.ps1). Query samples parse
  # each session's CONTEXT_INFO as a W3C traceparent, so samples from books-dotnet
  # carry the request's trace_id.
  sqlserver:
    collection_interval: 10s
    # Named instance: perf counters live under MSSQL$SQLEXPRESS:* (needs both).
    computer_name: ${env:COMPUTERNAME}
    instance_name: SQLEXPRESS
    resource_attributes:
      sqlserver.instance.name:
        enabled: true
    datasource: "sqlserver://127.0.0.1:1433?database=master&encrypt=disable&app+name=otelcol-sqlserver"
    metrics:
      sqlserver.database.io:
        enabled: true
      sqlserver.database.latency:
        enabled: true
      sqlserver.database.operations:
        enabled: true
      sqlserver.processes.blocked:
        enabled: true
      sqlserver.os.wait.duration:
        enabled: true
      sqlserver.memory.usage:
        enabled: true
      sqlserver.deadlock.rate:
        enabled: true
    events:
      db.server.query_sample:
        enabled: true
      db.server.top_query:
        enabled: true
    query_sample_collection:
      max_rows_per_query: 100
    top_query_collection:
      lookback_time: 60s
      collection_interval: 60s
      top_query_count: 50

processors:
  # Like resource/common, but keeps the app's own service.name
  # (resource/common upserts service.name=windows-host).
  resource/app:
    attributes:
      - key: env_name
        value: "win"
        action: upsert
      - key: host
        value: ${env:COMPUTERNAME}
        action: upsert
      - key: host.name
        value: ${env:COMPUTERNAME}
        action: insert

  # Shared context for the books stack's infrastructure (IIS, SQL Server); the app
  # sets the same deployment.environment.name itself. No namespace on this host.
  resource/infra:
    attributes:
      - key: env_name
        value: "win"
        action: upsert
      - key: deployment.environment.name
        value: "win"
        action: upsert
      - key: host
        value: ${env:COMPUTERNAME}
        action: upsert
      - key: host.name
        value: ${env:COMPUTERNAME}
        action: insert

  # books-dotnet SqlClient spans (see README "Deviations from semantic conventions"):
  #  - strip the SET CONTEXT_INFO prefix the app adds for SQL Server correlation, so
  #    db.query.text shows the app's statement (the prefix is plumbing, not the query);
  #  - add legacy db.system=mssql beside the stable db.system.name: groundcover derives
  #    protocol_type from the legacy key;
  #  - peer-service mapping: calls to this host's SQL Server get service.peer.name (and the
  #    deprecated peer.service) = the sqlserver receiver's service.name, so the span's peer
  #    is the same "sqlserver" entity groundcover shows in Workloads.
  transform/sqlclient_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'replace_pattern(attributes["db.query.text"], "^SET CONTEXT_INFO @traceparent;\\s*", "") where attributes["db.query.text"] != nil'
          - set(attributes["db.system"], "mssql") where attributes["db.system.name"] == "microsoft.sql_server"
          - set(attributes["service.peer.name"], "sqlserver") where attributes["db.system.name"] == "microsoft.sql_server" and attributes["server.address"] == "${env:COMPUTERNAME}"
          - set(attributes["peer.service"], "sqlserver") where attributes["db.system.name"] == "microsoft.sql_server" and attributes["server.address"] == "${env:COMPUTERNAME}"

  resource/iis:
    attributes:
      - key: service.name
        value: "iis"
        action: upsert

  resource/sqlserver:
    attributes:
      - key: service.name
        value: "sqlserver"
        action: upsert

  # IIS metrics for the books-dotnet site/app pool belong to the app's service.
  transform/iis_app:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "books-dotnet") where attributes["iis.site"] == "books-dotnet"
          - set(attributes["service.name"], "books-dotnet") where attributes["iis.application_pool"] == "books-dotnet"

  # Drop samples/top-queries of the collector's own monitoring queries: it logs in as
  # LocalSystem, and its queries all read system DMVs / @@SERVERNAME (the app's never do).
  filter/sqlserver_self:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["user.name"] == "NT AUTHORITY\\SYSTEM"'
        - 'IsMatch(attributes["db.query.text"], "sys\\s*\\.\\s*(dm_|master_files)|@@SERVERNAME")'

  # Query-sample / top-query events have no body or severity; give them both.
  transform/sqlserver_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(severity_number, SEVERITY_NUMBER_INFO)
          - set(severity_text, "INFO")
          - 'set(body, Concat([event_name, attributes["db.query.text"]], ": ")) where attributes["db.query.text"] != nil'

  # Everything sent to the groundcover "demo" workspace is labelled production there.
  # Applied only in the */demo pipelines, so the experiments workspace keeps env "win".
  resource/groundcover_demo:
    attributes:
      - key: env_name
        value: "production"
        action: upsert
      - key: deployment.environment.name
        value: "production"
        action: upsert

exporters:
  # Second destination: groundcover "demo" workspace. The live config has the real
  # ingestion key in place of <demo-ingestion-key>.
  otlphttp/groundcover_demo:
    endpoint: https://demo.platform.grcv.io
    headers:
      Authorization: "Bearer <demo-ingestion-key>"
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  pipelines:
    # --- App telemetry over OTLP (books-dotnet) ---
    traces/app:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, transform/sqlclient_spans, batch]
      exporters: [otlphttp/groundcover]

    metrics/app:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, batch]
      exporters: [otlphttp/groundcover]

    logs/app:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, batch]
      exporters: [otlphttp/groundcover]

    # --- Infrastructure behind books-dotnet ---
    metrics/iis:
      receivers: [iis]
      processors: [memory_limiter, resource/infra, resource/iis, transform/iis_app, batch]
      exporters: [otlphttp/groundcover]

    metrics/sqlserver:
      receivers: [sqlserver]
      processors: [memory_limiter, resource/infra, resource/sqlserver, batch]
      exporters: [otlphttp/groundcover]

    logs/sqlserver:
      receivers: [sqlserver]
      processors: [memory_limiter, filter/sqlserver_self, resource/infra, resource/sqlserver, transform/sqlserver_logs, batch]
      exporters: [otlphttp/groundcover]

    # --- Copies of every pipeline for the groundcover "demo" workspace ---
    # Same receivers (fanned out) and processors, plus resource/groundcover_demo
    # (env production). Separate pipelines so the env relabel doesn't reach experiments.
    metrics/host_demo:
      receivers: [hostmetrics/system, windowsperfcounters/cpu, windowsperfcounters/memory, windowsperfcounters/disk]
      processors: [memory_limiter, resource/common, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    metrics/self_demo:
      receivers: [prometheus/self]
      processors: [memory_limiter, resource/self, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    logs/demo:
      receivers: [windowseventlog/system, windowseventlog/application]
      processors: [memory_limiter, filter/drop_self_logs, resource/common, transform/windows_logs, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    traces/app_demo:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, transform/sqlclient_spans, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    metrics/app_demo:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    logs/app_demo:
      receivers: [otlp]
      processors: [memory_limiter, resource/app, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    metrics/iis_demo:
      receivers: [iis]
      processors: [memory_limiter, resource/infra, resource/iis, transform/iis_app, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    metrics/sqlserver_demo:
      receivers: [sqlserver]
      processors: [memory_limiter, resource/infra, resource/sqlserver, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]

    logs/sqlserver_demo:
      receivers: [sqlserver]
      processors: [memory_limiter, filter/sqlserver_self, resource/infra, resource/sqlserver, transform/sqlserver_logs, resource/groundcover_demo, batch]
      exporters: [otlphttp/groundcover_demo]
